# * Requires Black formatting and pytest on push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  BLACK_VERSION: "26.10.1"
  PYTEST_VERSION: "9.1.1"

jobs:
  black:
    name: black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Black
        run: python -m pip install "black==${BLACK_VERSION}"
      - name: Check formatting
        run: python -m black --check --diff .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pytest
        run: python -m pip install "pytest==${PYTEST_VERSION}"
      - name: Run pytest
        run: python -m pytest

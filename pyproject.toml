[project]
name = "compiled-hackathon"
version = "0.1.0"
description = "Live microphone censor for Zoom audio calls"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.2",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "pytest==9.1.1",
]

[tool.black]
required-version = "26.10.1"
target-version = ["py314"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
